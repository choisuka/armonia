<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>아이와 떠나는 국내 여행 베스트</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a1a;color:#e2e8f0;font-family:'Malgun Gothic','Apple SD Gothic Neo',sans-serif;line-height:1.7}
header{background:linear-gradient(135deg,#0a2e2e,#0d4e4e);padding:40px 20px;text-align:center;border-bottom:1px solid rgba(6,182,212,.3)}
header h1{font-size:1.7rem;color:#67e8f9;margin-bottom:8px}
header p{color:rgba(255,255,255,.55);font-size:.9rem}
.back-btn{display:inline-block;margin-top:16px;padding:.45rem 1.2rem;background:rgba(6,182,212,.15);border:1px solid rgba(6,182,212,.4);border-radius:999px;color:#67e8f9;text-decoration:none;font-size:.82rem}
.loc-bar{display:flex;justify-content:center;gap:8px;padding:16px 20px;flex-wrap:wrap;background:rgba(255,255,255,.03);border-bottom:1px solid rgba(255,255,255,.08)}
.loc-bar input{padding:.5rem 1rem;border-radius:999px;border:1px solid rgba(255,255,255,.15);background:rgba(255,255,255,.05);color:#e2e8f0;font-size:.85rem;min-width:200px}
.loc-bar button{padding:.5rem 1.2rem;border-radius:999px;border:none;background:linear-gradient(135deg,#0d9488,#06b6d4);color:#fff;font-weight:700;font-size:.85rem;cursor:pointer}
.loc-status{width:100%;text-align:center;font-size:.78rem;color:#67e8f9;margin-top:4px}
.tab-wrap{position:sticky;top:0;z-index:100;background:#0a0a1a;border-bottom:1px solid rgba(255,255,255,.08);display:flex;overflow-x:auto;gap:0}
.tab{flex:1;min-width:120px;text-align:center;padding:14px 8px;font-size:.82rem;color:rgba(255,255,255,.45);cursor:pointer;border-bottom:2px solid transparent;transition:.2s;white-space:nowrap}
.tab.active{color:#67e8f9;border-bottom-color:#67e8f9}
.section{display:none;max-width:900px;margin:0 auto;padding:32px 20px}
.section.active{display:block}
.place{background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.07);border-radius:12px;padding:16px 18px;margin-bottom:12px}
.place:hover{background:rgba(6,182,212,.07);border-color:rgba(6,182,212,.25)}
.place-header{display:flex;align-items:flex-start;gap:10px;margin-bottom:8px}
.place-icon{font-size:1.3rem}
.place-title{font-size:.98rem;color:#e2e8f0;font-weight:700;flex:1}
.place-loc{font-size:.75rem;color:#67e8f9;margin-top:2px}
.place-dist{display:inline-block;margin-top:4px;padding:2px 10px;border-radius:999px;font-size:.72rem;font-weight:700;background:rgba(16,185,129,.15);color:#6ee7b7;border:1px solid rgba(16,185,129,.3)}
.desc-label{display:block;color:#67e8f9;font-weight:700;font-size:.76rem;margin-top:10px;margin-bottom:2px;letter-spacing:.02em}
.place p{margin:0;color:#94a3b8;font-size:.82rem;line-height:1.7}
.btn-row{margin-top:10px}
.map-btn{display:inline-block;padding:5px 14px;background:rgba(6,182,212,.12);border:1px solid rgba(6,182,212,.35);border-radius:999px;color:#67e8f9;font-size:.75rem;font-weight:700;text-decoration:none}
.map-btn:hover{background:rgba(6,182,212,.25);color:#fff}
</style>
</head>
<body>

<header>
  <h1>✈️ 아이와 떠나는 국내 여행 베스트</h1>
  <p>0~2세 · 3~5세 · 6~8세 · 9세 이상 · 연령별 추천 여행지 16곳</p>
  <a class="back-btn" href="index.html">← 허브로 돌아가기</a>
</header>

<div class="loc-bar">
  <input type="text" id="loc-input" placeholder="지역/도시 입력 (예: 서울, 부산, 춘천)">
  <button onclick="searchLocation()">📍 가까운 순으로 보기</button>
  <div class="loc-status" id="loc-status"></div>
</div>

<div class="tab-wrap">
  <div class="tab active" onclick="showTab('age1')">👶 0~2세</div>
  <div class="tab" onclick="showTab('age2')">🌱 3~5세</div>
  <div class="tab" onclick="showTab('age3')">🎡 6~8세</div>
  <div class="tab" onclick="showTab('age4')">🏞️ 9세 이상</div>
</div>

<div class="section active" id="tab-age1"><div class="grid" id="grid-age1"></div></div>
<div class="section" id="tab-age2"><div class="grid" id="grid-age2"></div></div>
<div class="section" id="tab-age3"><div class="grid" id="grid-age3"></div></div>
<div class="section" id="tab-age4"><div class="grid" id="grid-age4"></div></div>

<script>
const PLACES = [
  {age:'age1', icon:'🐟', title:'아쿠아리움(수족관)', loc:'예: 코엑스 아쿠아리움 (전국 주요 도시에 롯데월드·부산 등도 있음)', badges:'실내 · 사계절', desc:'천천히 걸으며 눈으로만 즐기는 조용한 코스라 아기 페이스에 잘 맞습니다. 유아차 이동이 편하고 실내라 날씨 걱정이 없습니다.', tip:'사람이 적은 평일 오전에 방문하면 여유롭게 볼 수 있습니다.', mapQuery:'코엑스 아쿠아리움', lat:37.5132, lng:127.0586},
  {age:'age1', icon:'🏛️', title:'어린이박물관', loc:'예: 국립어린이박물관(세종) (각 지역 시립 어린이박물관도 있음)', badges:'실내 · 사계절', desc:'영유아 전용 체험존이 따로 마련된 곳이 많아 안전하게 감각 놀이를 할 수 있습니다.', tip:'연령대별 체험존이 나뉜 곳이 많으니 방문 전 홈페이지에서 대상 연령을 확인하세요.', mapQuery:'국립어린이박물관', lat:36.4888, lng:127.2731},
  {age:'age1', icon:'🦁', title:'실내 동물원 · 키즈카페형 체험관', loc:'전국 주요 대형 쇼핑몰 내', badges:'실내 · 사계절', desc:'냉난방이 잘 되는 실내에서 작은 동물을 가까이 보고 만질 수 있어 첫 나들이로 부담이 적습니다.', tip:'수유실·기저귀 교환대가 있는 곳인지 미리 확인하면 훨씬 편합니다.', mapQuery:'실내동물원', lat:null, lng:null},
  {age:'age1', icon:'🌳', title:'수목원 · 식물원', loc:'예: 한택식물원(용인) (전국 주요 수목원 다수)', badges:'실외 · 봄·가을', desc:'넓고 평탄한 산책로가 많아 유아차로 이동하기 좋고, 꽃과 나무를 보며 오감 자극을 줄 수 있습니다.', tip:'한여름·한겨울은 피하고 봄·가을 날씨 좋은 날을 고르세요.', mapQuery:'한택식물원', lat:37.1614, lng:127.3743},

  {age:'age2', icon:'🐧', title:'에코랜드(제주)', loc:'제주특별자치도 제주시', badges:'실외 · 봄·가을', desc:'숲 기차를 타고 제주 곶자왈 숲을 편안하게 둘러볼 수 있어, 오래 걷기 힘든 유아와 함께하기 좋습니다.', tip:'기차 좌석은 야외라 여름엔 더울 수 있으니 모자·물을 챙기세요.', mapQuery:'에코랜드 제주', lat:33.4552, lng:126.6661},
  {age:'age2', icon:'🐻', title:'뽀로로파크 · 캐릭터 테마파크', loc:'서울·잠실 등 전국 주요 지점', badges:'실내 · 사계절', desc:'좋아하는 캐릭터를 직접 만나고 놀이기구를 타볼 수 있어 눈높이에 딱 맞는 첫 테마파크 경험이 됩니다.', tip:'양말 착용이 필수인 곳이 많으니 미리 준비하세요.', mapQuery:'뽀로로파크', lat:37.5126, lng:127.1027},
  {age:'age2', icon:'🎠', title:'어린이대공원', loc:'서울 광진구', badges:'실외 · 사계절', desc:'동물원, 놀이동산, 넓은 잔디밭이 한곳에 있어 하루 종일 다양하게 놀 수 있는 대표적인 가족 나들이 장소입니다.', tip:'유아차 대여가 가능한 곳이 많으니 미리 알아보면 편합니다.', mapQuery:'어린이대공원', lat:37.5481, lng:127.0691},
  {age:'age2', icon:'🚜', title:'목장 체험 · 동물농장 체험', loc:'예: 대관령(평창) 일대 목장 (전국 주요 목장 다수)', badges:'실외 · 봄·여름·가을', desc:'양·젖소·토끼 등에게 먹이를 주는 체험을 통해 동물과 자연을 직접 느낄 수 있는 활동입니다.', tip:'흙바닥이 많으니 갈아입을 옷과 신발을 여유롭게 챙기세요.', mapQuery:'대관령 목장', lat:37.6755, lng:128.7077},

  {age:'age3', icon:'🧱', title:'레고랜드', loc:'강원 춘천시', badges:'실외 · 봄·가을', desc:'레고 블록 테마의 놀이기구와 레고랜드 전용 캐릭터들을 만날 수 있는 국내 유일 레고 테마파크입니다.', tip:'인기 놀이기구는 대기가 길 수 있어 개장 직후 입장을 추천합니다.', mapQuery:'레고랜드 춘천', lat:37.8857, lng:127.6993},
  {age:'age3', icon:'🐟', title:'화천 산천어축제', loc:'강원 화천군 (매년 겨울 개최)', badges:'실외 · 겨울', desc:'얼음 낚시로 산천어를 직접 잡아보는 체험이 핵심으로, 겨울 방학 대표 가족 축제입니다.', tip:'매우 춥고 대기 줄이 길 수 있으니 방한용품을 단단히 준비하세요. 개최 일정은 매년 바뀌니 방문 전 공식 정보를 확인하세요.', mapQuery:'화천 산천어축제', lat:38.1042, lng:127.7074},
  {age:'age3', icon:'🔬', title:'국립과천과학관', loc:'경기 과천시', badges:'실내 · 사계절', desc:'직접 만지고 실험하는 체험형 전시가 많아 놀면서 과학 원리를 자연스럽게 배울 수 있습니다.', tip:'천체투영관(플라네타리움) 상영 시간은 미리 예약하는 걸 추천합니다.', mapQuery:'국립과천과학관', lat:37.4385, lng:127.0062},
  {age:'age3', icon:'🎢', title:'서울랜드', loc:'경기 과천시', badges:'실외 · 사계절', desc:'어린이용 놀이기구부터 스릴 있는 기구까지 다양하게 있어 온 가족이 함께 즐기기 좋은 테마파크입니다.', tip:'바로 옆 서울대공원 동물원과 함께 묶어 하루 코스로 즐기기 좋습니다.', mapQuery:'서울랜드', lat:37.4341, lng:127.0203},

  {age:'age4', icon:'🎢', title:'롯데월드 · 에버랜드', loc:'서울 송파구 / 경기 용인시', badges:'실내·실외 · 사계절', desc:'본격적인 놀이기구를 즐길 수 있는 나이대로, 국내 대표 놀이공원에서 스릴 넘치는 하루를 보낼 수 있습니다.', tip:'인기 기구는 앱으로 대기표(패스트트랙)를 미리 확인하면 시간을 아낄 수 있습니다.', mapQuery:'에버랜드', lat:37.2939, lng:127.2048},
  {age:'age4', icon:'🏯', title:'경주 역사문화 체험(불국사·첨성대 등)', loc:'경북 경주시', badges:'실외 · 봄·가을', desc:'교과서 속 유적지를 직접 눈으로 보며 역사에 대한 흥미를 키울 수 있는 대표적인 체험 여행지입니다.', tip:'한복을 대여해 입고 다니면 사진도 예쁘고 아이의 몰입도도 높아집니다.', mapQuery:'경주 불국사', lat:35.7890, lng:129.3309},
  {age:'age4', icon:'🏔️', title:'설악산 케이블카', loc:'강원 속초시', badges:'실외 · 봄·가을', desc:'힘든 등산 없이 케이블카로 편하게 웅장한 산 정상 풍경을 즐길 수 있어 자연을 좋아하는 아이에게 좋은 경험이 됩니다.', tip:'날씨(특히 강풍)에 따라 운행이 중단될 수 있으니 방문 전 운행 여부를 확인하세요.', mapQuery:'설악산 케이블카', lat:38.1606, lng:128.4959},
  {age:'age4', icon:'🏮', title:'전주 한옥마을', loc:'전북 전주시', badges:'실외 · 사계절', desc:'전통 한옥 골목을 걸으며 한복 체험, 전통 간식 먹거리까지 즐길 수 있는 문화 여행 코스입니다.', tip:'주말엔 사람이 많으니 평일이나 이른 아침 방문을 추천합니다.', mapQuery:'전주 한옥마을', lat:35.8170, lng:127.1480}
];

let userLoc = null;

function haversine(lat1, lng1, lat2, lng2){
  const R = 6371;
  const dLat = (lat2-lat1) * Math.PI/180;
  const dLng = (lng2-lng1) * Math.PI/180;
  const a = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLng/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

async function searchLocation(){
  const q = document.getElementById('loc-input').value.trim();
  const statusEl = document.getElementById('loc-status');
  if(!q){ statusEl.textContent=''; userLoc=null; localStorage.removeItem('armoonia_travel_loc'); renderAll(); return; }
  statusEl.textContent = '검색 중...';
  try{
    const res = await fetch(`https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(q)}&format=json&limit=1&countrycodes=kr`);
    const data = await res.json();
    if(!data.length){ statusEl.textContent = `"${q}"을(를) 찾을 수 없습니다.`; return; }
    userLoc = {lat: parseFloat(data[0].lat), lng: parseFloat(data[0].lon)};
    localStorage.setItem('armoonia_travel_loc', JSON.stringify({q, lat: userLoc.lat, lng: userLoc.lng}));
    statusEl.textContent = `📍 "${q}" 기준 가까운 순으로 정렬했습니다. (다음 방문 때 자동으로 불러옵니다)`;
    renderAll();
  }catch(e){
    statusEl.textContent = '위치 검색에 실패했습니다. 잠시 후 다시 시도해주세요.';
  }
}

function loadSavedLocation(){
  const saved = localStorage.getItem('armoonia_travel_loc');
  if(!saved) return;
  try{
    const {q, lat, lng} = JSON.parse(saved);
    document.getElementById('loc-input').value = q;
    userLoc = {lat, lng};
    document.getElementById('loc-status').textContent = `📍 저장된 위치 "${q}" 기준으로 정렬했습니다. (바꾸려면 다시 입력 후 검색)`;
  }catch(e){}
}

function renderGroup(age){
  let list = PLACES.filter(p => p.age === age);
  if(userLoc){
    list = list.map(p => ({...p, dist: (p.lat!=null) ? haversine(userLoc.lat, userLoc.lng, p.lat, p.lng) : null}));
    list.sort((a,b) => {
      if(a.dist==null) return 1;
      if(b.dist==null) return -1;
      return a.dist - b.dist;
    });
  }
  document.getElementById('grid-'+age).innerHTML = list.map(p => `
    <div class="place">
      <div class="place-header"><span class="place-icon">${p.icon}</span><div><div class="place-title">${p.title}</div><div class="place-loc">${p.loc}</div>
      ${p.dist!=null ? `<span class="place-dist">약 ${Math.round(p.dist)}km</span>` : ''}
      </div></div>
      <span class="desc-label">📋 소개</span>
      <p>${p.desc}</p>
      <span class="desc-label">💡 팁</span>
      <p>${p.tip}</p>
      <div class="btn-row"><a class="map-btn" href="https://map.naver.com/p/search/${encodeURIComponent(p.mapQuery)}" target="_blank" rel="nofollow noopener">🗺️ 네이버지도에서 찾기</a></div>
    </div>
  `).join('');
}

function renderAll(){
  ['age1','age2','age3','age4'].forEach(renderGroup);
}

function showTab(id) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
  document.getElementById('tab-' + id).classList.add('active');
  event.target.classList.add('active');
}

document.getElementById('loc-input').addEventListener('keydown', e => { if(e.key==='Enter') searchLocation(); });
loadSavedLocation();
renderAll();
</script>

</body>
</html>
